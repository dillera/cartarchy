# /etc/nginx/sites-available/cartarchy-acme.conf
# Plain HTTP from frpc. Serves Let's Encrypt HTTP-01 challenges and redirects
# everything else to HTTPS. Its own port keeps it out of the 8901 default_server.
server {
	listen       127.0.0.1:8902;
	server_name  cartarchy.diller.org;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://cartarchy.diller.org$request_uri;
	}
}
