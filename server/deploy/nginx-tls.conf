# /etc/nginx/sites-available/cartarchy-tls.conf
# TLS passed through by frpc. Enable only after certbot has issued the certificate.
server {
	listen       127.0.0.1:8943 ssl http2;
	server_name  cartarchy.diller.org;

	ssl_certificate      /etc/letsencrypt/live/cartarchy.diller.org/fullchain.pem;
	ssl_certificate_key  /etc/letsencrypt/live/cartarchy.diller.org/privkey.pem;
	ssl_protocols        TLSv1.2 TLSv1.3;
	ssl_session_cache    shared:cartarchy:1m;

	add_header Strict-Transport-Security "max-age=31536000" always;

	location / {
		proxy_pass        http://127.0.0.1:18080;
		proxy_set_header  Host $host;
		proxy_set_header  X-Forwarded-Proto https;
	}

	# Server-sent events: no buffering, and outlast the 25s server keepalive.
	location = /v1/events {
		proxy_pass          http://127.0.0.1:18080;
		proxy_http_version  1.1;
		proxy_set_header    Connection "";
		proxy_set_header    Host $host;
		proxy_buffering     off;
		proxy_cache         off;
		proxy_read_timeout  1h;
	}
}
